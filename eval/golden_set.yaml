- id: q15
  pregunta: ¿Cuántos contratos hay por estado de fecha de inicio y fuente?
  dificultad: facil
  sql_esperado: |
    SELECT fuente, fecha_inicio_estado, COUNT(*) AS contratos
    FROM clean.v_contratos_agente
    GROUP BY fuente, fecha_inicio_estado
    ORDER BY fuente, fecha_inicio_estado
    LIMIT 30
  notas: Fechas nulas o no parseables se conservan con estado explícito.
- id: q16
  pregunta: Muestra hasta 20 contratos cuya fecha de fin aparece antes de la fecha de inicio.
  dificultad: media
  sql_esperado: |
    SELECT codigo_contrato, fuente, fecha_inicio, fecha_fin
    FROM clean.v_contratos_agente
    WHERE fecha_fin_antes_inicio
    ORDER BY fecha_inicio DESC, codigo_contrato
    LIMIT 20
  notas: La bandera es una señal de calidad de datos y requiere verificar la fuente.
- id: q17
  pregunta: ¿Cuál es el importe registrado por moneda para contratos históricos iniciados en 2024?
  dificultad: media
  sql_esperado: |
    SELECT moneda, SUM(importe) AS importe_registrado
    FROM clean.v_contratos_agente
    WHERE fuente = 'historico'
      AND fecha_inicio >= DATE '2024-01-01'
      AND fecha_inicio < DATE '2025-01-01'
    GROUP BY moneda
    ORDER BY moneda
