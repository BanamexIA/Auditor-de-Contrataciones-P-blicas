  notas: El cruce del histórico se interpreta según la vista de coincidencias aprobada y no implica certeza jurídica.
- id: q14
  pregunta: Muestra contratos iniciados en 2025 que tengan unidad compradora identificada.
  dificultad: media
  sql_esperado: |
    SELECT codigo_contrato, nombre_de_la_uc, fecha_inicio
    FROM clean.v_contratos_agente
    WHERE fecha_inicio >= DATE '2025-01-01'
      AND fecha_inicio < DATE '2026-01-01'
      AND nombre_de_la_uc IS NOT NULL
    ORDER BY fecha_inicio, codigo_contrato
    LIMIT 20
