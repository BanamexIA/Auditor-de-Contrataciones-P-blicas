  notas: No combinar monedas ni interpretar el campo como gasto pagado sin validar su semántica.
- id: q18
  pregunta: ¿Qué artículos de excepción aparecen en ComprasMX y cuántos registros hay por artículo?
  dificultad: media
  sql_esperado: |
    SELECT articulo_de_excepcion, COUNT(*) AS contratos
    FROM clean.v_contratos_agente
    WHERE fuente = 'comprasmx'
      AND articulo_de_excepcion IS NOT NULL
    GROUP BY articulo_de_excepcion
    ORDER BY contratos DESC, articulo_de_excepcion
    LIMIT 50
  notas: El fundamento publicado se reporta como está en la fuente y no se evalúa jurídicamente.
- id: q19
  pregunta: ¿Cuántas coincidencias exactas 69-B requieren revisión humana por fuente?
  dificultad: dificil
  sql_esperado: |
    SELECT c.fuente, COUNT(DISTINCT c.codigo_contrato) AS coincidencias_para_revision
    FROM clean.v_contratos_agente AS c
    JOIN clean.v_coincidencias_69b_agente AS m
      ON m.codigo_contrato = c.codigo_contrato
    WHERE m.rfc_exacto
      AND m.requiere_revision_humana
    GROUP BY c.fuente
    ORDER BY c.fuente
    LIMIT 20
  notas: Los casos se presentan para revisión humana, no como hallazgos concluyentes.
- id: q20
  pregunta: Muestra contratos con una unidad compradora identificada en el histórico de 2024.
