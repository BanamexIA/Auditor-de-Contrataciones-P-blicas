services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-auditor_contrataciones}
      ETL_USER: ${ETL_USER:-etl_user}
      ETL_USER_PASSWORD: ${ETL_USER_PASSWORD:?Set ETL_USER_PASSWORD in .env}
      AGENT_RO_USER: ${AGENT_RO_USER:-agent_ro}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?Set AGENT_RO_PASSWORD in .env}
      BACKEND_USER: ${BACKEND_USER:-backend_app}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:?Set BACKEND_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./etl/sql:/opt/etl/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://host.docker.internal:11434}
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:7b}
      TELEMETRY_SINK: ${TELEMETRY_SINK:-database}
      TELEMETRY_AGENT: ${TELEMETRY_AGENT:-backend}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-auditor_contrataciones}
      # El backend usa su propio rol (audit y telemetry); el SQL de los agentes, agent_ro.
      DB_USER: ${BACKEND_USER:-backend_app}
      DB_PASSWORD: ${BACKEND_PASSWORD:?Set BACKEND_PASSWORD in .env}
      AGENT_RO_USER: ${AGENT_RO_USER:-agent_ro}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?Set AGENT_RO_PASSWORD in .env}
      # Firma de los tokens de sesión (>= 32 caracteres). Sin él la API no arranca en Compose.
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      AUTH_TOKEN_HORAS: ${AUTH_TOKEN_HORAS:-8}
      REPORTES_ALMACEN: ${REPORTES_ALMACEN:-local}
      REPORTES_DIR: /app/data/reportes
      REPORTES_S3_BUCKET: ${REPORTES_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AGENTES_VERIFICAR_CADA_S: ${AGENTES_VERIFICAR_CADA_S:-60}
    volumes:
      - reportes_data:/app/data/reportes
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/db', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  reportes_data:
